<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공간대여 이야기 | 수머 SUUMO</title>
  <meta name="description" content="공간대여업 기초, 운영 실전, 공실상가 활용, 무인 운영 노하우를 소개하는 수머의 공간대여 이야기입니다.">
  <link rel="canonical" href="https://suumo.co.kr/story.html">
  <style>
    :root{
      --green:#0f8f68;
      --green-dark:#087050;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --bg:#f7f8f7;
      --white:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.6;
    }
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1100px;margin:0 auto;padding:0 22px}
    header{
      position:sticky;top:0;z-index:10;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(8px);
    }
    .header-inner{
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }
    .brand{
      font-weight:800;
      font-size:30px;
      letter-spacing:-1px;
      color:var(--green);
      white-space:nowrap;
    }
    nav{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:18px;
      font-size:15px;
    }
    nav a:hover{color:var(--green)}
    .btn{
      background:var(--green);
      color:white;
      padding:8px 13px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
    }
    .hero{
      background:linear-gradient(180deg,#fff 0%,#f2f7f5 100%);
      border-bottom:1px solid var(--line);
    }
    .hero-inner{padding:58px 22px 44px}
    .eyebrow{
      color:var(--green);
      font-weight:800;
      font-size:14px;
      margin-bottom:10px;
    }
    h1{
      margin:0 0 14px;
      font-size:clamp(34px,5vw,58px);
      line-height:1.15;
      letter-spacing:-2px;
      word-break:keep-all;
    }
    h1 span{color:var(--green)}
    .hero p{
      margin:0;
      color:var(--muted);
      font-size:17px;
      word-break:keep-all;
    }
    main{padding:34px 0 70px}
    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }
    .categories{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .cat{
      padding:8px 13px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:999px;
      font-size:14px;
      cursor:pointer;
    }
    .cat.active,.cat:hover{
      border-color:var(--green);
      color:var(--green);
      font-weight:700;
    }
    .search{
      width:min(320px,100%);
      border:1px solid var(--line);
      border-radius:12px;
      padding:11px 14px;
      font-size:14px;
      background:#fff;
    }
    .post-list{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
    }
    .post{
      display:grid;
      grid-template-columns:110px 1fr auto;
      gap:20px;
      align-items:center;
      padding:24px 26px;
      border-bottom:1px solid var(--line);
    }
    .post:last-child{border-bottom:0}
    .post:hover{background:#fbfdfc}
    .badge{
      justify-self:start;
      padding:6px 10px;
      border-radius:999px;
      background:#eaf6f1;
      color:var(--green-dark);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .post h2{
      margin:0 0 5px;
      font-size:20px;
      line-height:1.35;
      letter-spacing:-.5px;
      word-break:keep-all;
    }
    .post .summary{
      margin:0;
      color:var(--muted);
      font-size:14px;
      word-break:keep-all;
    }
    .date{
      color:#9ca3af;
      font-size:13px;
      white-space:nowrap;
    }
    .empty{
      display:none;
      padding:40px 20px;
      text-align:center;
      color:var(--muted);
    }
    footer{
      border-top:1px solid var(--line);
      background:#fff;
      color:var(--muted);
      text-align:center;
      padding:28px 20px;
      font-size:13px;
    }
    @media (max-width:760px){
      .header-inner{display:block;padding:18px 0}
      .brand{text-align:center;margin-bottom:14px}
      nav{justify-content:center;gap:11px 14px}
      .hero-inner{padding-top:42px}
      .post{
        grid-template-columns:1fr;
        gap:8px;
        padding:20px;
      }
      .date{justify-self:start}
      .toolbar{align-items:stretch}
      .search{width:100%}
    }
  </style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <a class="brand" href="index.html">SUUMO 수머</a>
    <nav>
      <a href="index.html#about">수머 소개</a>
      <a href="index.html#space">공간 찾기</a>
      <a href="story.html"><strong>공간대여 이야기</strong></a>
      <a href="index.html#case">공간 사례</a>
      <a class="btn" href="index.html#register">공간 등록</a>
      <a class="btn" href="mailto:">이메일 문의하기</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-inner">
    <div class="eyebrow">SUUMO STORY</div>
    <h1>공간대여 <span>이야기</span></h1>
    <p>공간대여업의 기초부터 운영 실전, 공실 활용, 무인 운영까지 차근차근 기록합니다.</p>
  </div>
</section>

<main class="wrap">
  <div class="toolbar">
    <div class="categories">
      <button class="cat active" data-cat="전체">전체</button>
      <button class="cat" data-cat="공간대여업 기초">공간대여업 기초</button>
      <button class="cat" data-cat="운영 실전">운영 실전</button>
      <button class="cat" data-cat="공실상가">공실상가</button>
      <button class="cat" data-cat="무인 운영">무인 운영</button>
      <button class="cat" data-cat="공간 사례">공간 사례</button>
    </div>
    <input id="search" class="search" type="search" placeholder="제목이나 내용 검색">
  </div>

  <section class="post-list" id="postList">
    <a class="post" href="posts/001.html" data-cat="공간대여업 기초" data-text="공간대여업이란 무엇인가 공간을 시간 단위로 빌려주는 사업의 기본 구조">
      <span class="badge">공간대여업 기초</span>
      <div>
        <h2>공간대여업이란 무엇인가</h2>
        <p class="summary">공간을 시간 단위로 빌려주는 사업의 기본 구조부터 살펴봅니다.</p>
      </div>
      <span class="date">2026.09.30</span>
    </a>

    <!-- 새 글 추가 예시
    <a class="post" href="posts/002.html" data-cat="운영 실전" data-text="제목 요약 검색용 문장">
      <span class="badge">운영 실전</span>
      <div>
        <h2>새 글 제목</h2>
        <p class="summary">새 글 요약</p>
      </div>
      <span class="date">2026.10.01</span>
    </a>
    -->
    <div class="empty" id="empty">검색 결과가 없습니다.</div>
  </section>
</main>

<footer>
  © 2026 SUUMO. 숨어있는 공간을 발견하다.
</footer>

<script>
  const cats = document.querySelectorAll('.cat');
  const posts = [...document.querySelectorAll('.post')];
  const search = document.getElementById('search');
  const empty = document.getElementById('empty');
  let currentCat = '전체';

  function filterPosts(){
    const q = search.value.trim().toLowerCase();
    let count = 0;
    posts.forEach(post => {
      const catOk = currentCat === '전체' || post.dataset.cat === currentCat;
      const textOk = !q || post.dataset.text.toLowerCase().includes(q) || post.innerText.toLowerCase().includes(q);
      const show = catOk && textOk;
      post.style.display = show ? 'grid' : 'none';
      if(show) count++;
    });
    empty.style.display = count ? 'none' : 'block';
  }

  cats.forEach(btn => {
    btn.addEventListener('click', () => {
      cats.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCat = btn.dataset.cat;
      filterPosts();
    });
  });

  search.addEventListener('input', filterPosts);
</script>
</body>
</html>
